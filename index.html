<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>TesteGyrooo</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        #unity-canvas {
            width: 100% !important;
            height: 100% !important;
            touch-action: none;
        }
    </style>
</head>

<body>
    <div id="unity-container">
        <canvas id="unity-canvas"></canvas>
    </div>

    <script>
        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/SensorTeste.loader.js";

        var config = {
            dataUrl: buildUrl + "/SensorTeste.data",
            frameworkUrl: buildUrl + "/SensorTeste.framework.js",
            codeUrl: buildUrl + "/SensorTeste.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "TesteGyrooo",
            productVersion: "1.0"
        };

        var canvas = document.querySelector("#unity-canvas");

        // Ajuste automático de resolução para celular
        function resizeCanvas() {
            canvas.style.width = "100%";
            canvas.style.height = "100%";
        }

        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => createUnityInstance(canvas, config);
        document.body.appendChild(script);
    </script>
</body>
</html>
