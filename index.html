<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>TesteGyrooo</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: none; /* escondido até carregar */
        }

        #unity-canvas {
            width: 100% !important;
            height: 100% !important;
            touch-action: none;
        }

        /* Tela inicial */
        #start-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            font-family: Arial;
        }

        #start-button {
            padding: 20px 40px;
            font-size: 24px;
            background: #1e90ff;
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
        }

        #start-button:hover {
            background: #3aa0ff;
        }

        /* Tela de carregamento */
        #loading-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #000;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            font-family: Arial;
        }

        #loading-bar {
            width: 60%;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
        }

        #loading-fill {
            width: 0%;
            height: 100%;
            background: #1e90ff;
        }
    </style>
</head>

<body>

    <!-- Tela inicial -->
    <div id="start-screen">
        <h1>TesteGyrooo</h1>
        <button id="start-button">Iniciar</button>
    </div>

    <!-- Tela de carregamento -->
    <div id="loading-screen">
        <h2>Carregando...</h2>
        <div id="loading-bar">
            <div id="loading-fill"></div>
        </div>
    </div>

    <!-- Canvas Unity -->
    <div id="unity-container">
        <canvas id="unity-canvas"></canvas>
    </div>

    <script>
        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/SensorTeste.loader.js";

        var config = {
            dataUrl: buildUrl + "/SensorTeste.data",
            frameworkUrl: buildUrl + "/SensorTeste.framework.js",
            codeUrl: buildUrl + "/SensorTeste.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "TesteGyrooo",
            productVersion: "1.0"
        };

        var canvas = document.querySelector("#unity-canvas");
        var startScreen = document.getElementById("start-screen");
        var loadingScreen = document.getElementById("loading-screen");
        var unityContainer = document.getElementById("unity-container");
        var loadingFill = document.getElementById("loading-fill");

        function resizeCanvas() {
            canvas.style.width = "100%";
            canvas.style.height = "100%";
        }

        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        document.getElementById("start-button").onclick = function () {
            startScreen.style.display = "none";
            loadingScreen.style.display = "flex";

            var script = document.createElement("script");
            script.src = loaderUrl;

            script.onload = () => {
                createUnityInstance(canvas, config, (progress) => {
                    loadingFill.style.width = (progress * 100) + "%";
                }).then(() => {
                    loadingScreen.style.display = "none";
                    unityContainer.style.display = "block";
                });
            };

            document.body.appendChild(script);
        };
    </script>
</body>
</html>
