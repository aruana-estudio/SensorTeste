<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Unity WebGL Player</title>
    <style>
        body { margin: 0; padding: 0; background: #000; }
        #unity-container { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas"></canvas>
    </div>

    <script>
        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/SensorTeste.loader.js";
        var config = {
            dataUrl: buildUrl + "/SensorTeste.data",
            frameworkUrl: buildUrl + "/SensorTeste.framework.js",
            codeUrl: buildUrl + "/SensorTeste.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "TesteGyrooo",
            productVersion: "1.0"
        };

        var canvas = document.querySelector("#unity-canvas");
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => createUnityInstance(canvas, config);
        document.body.appendChild(script);
    </script>
</body>
</html>
